  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

>\n  /* ===========================================================\n     DESIGN TOKENS\n     =========================================================== */\n  :root {\n    --bg-canvas: #EFE7D7;\n    --bg-primary: #FAF7F1;\n    --bg-elevated: #FFFCF6;\n    --surface-nika: #F4EFE6;\n    --surface-warm: #F4E4D6;\n    --surface-deep: #E9DFCB;\n\n    --ink-primary: #1F1B16;\n    --ink-secondary: #5C534A;\n    --ink-muted: #9A9085;\n    --ink-faint: #C2B7A6;\n\n    --border-subtle: #EFE9DD;\n    --border-default: #E5DDD0;\n    --border-strong: #D4C9B5;\n\n    --accent: #C8553D;\n    --accent-deep: #B0392A;\n    --accent-soft: #E8B7A8;\n\n    --serif: 'Fraunces', 'Tiempos', Georgia, serif;\n    --sans: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;\n    --mono: 'Geist Mono', 'SF Mono', monospace;\n\n    --radius-pill: 999px;\n    --radius-bubble: 18px;\n    --radius-card: 16px;\n    --radius-input: 14px;\n\n    --user-bubble-bg: #1F1B16;\n    --user-bubble-fg: #FAF7F1;\n    --frame-bezel: #1F1B16;\n    --notch: #0a0907;\n    --bg-blur: rgba(250,247,241,0.85);\n    --bg-blur-strong: rgba(250,247,241,0.95);\n    --topbar-blur: rgba(250,247,241,0.7);\n    --shadow-card: 0 1px 2px rgba(31,27,22,0.04), 0 8px 24px rgba(31,27,22,0.06);\n    --shadow-frame: 0 2px 4px rgba(31,27,22,0.06), 0 30px 60px -20px rgba(31,27,22,0.18), 0 18px 36px -18px rgba(31,27,22,0.12);\n  }\n\n  /* Dark theme */\n  body.dark {\n    --bg-canvas: #14110E;\n    --bg-primary: #1B1814;\n    --bg-elevated: #221E19;\n    --surface-nika: #2A241D;\n    --surface-warm: #3A2920;\n    --surface-deep: #2F2820;\n\n    --ink-primary: #F5EFE3;\n    --ink-secondary: #B5A998;\n    --ink-muted: #7A6F62;\n    --ink-faint: #4F4639;\n\n    --border-subtle: #2A241D;\n    --border-default: #34291F;\n    --border-strong: #4A3D2E;\n\n    --accent: #E07A5F;\n    --accent-deep: #C8553D;\n    --accent-soft: #5A3A2E;\n\n    --user-bubble-bg: #E8DFD0;\n    --user-bubble-fg: #1B1814;\n    --frame-bezel: #0a0907;\n    --notch: #000;\n    --bg-blur: rgba(20,17,14,0.85);\n    --bg-blur-strong: rgba(20,17,14,0.95);\n    --topbar-blur: rgba(20,17,14,0.7);\n  }\n\n  *, *::before, *::after { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    font-family: var(--sans);\n    background: var(--bg-canvas);\n    color: var(--ink-primary);\n    font-feature-settings: \"ss01\", \"ss02\", \"cv11\";\n    -webkit-font-smoothing: antialiased;\n    -moz-osx-font-smoothing: grayscale;\n    min-height: 100vh;\n    background-image:\n      radial-gradient(circle at 20% 0%, rgba(200,85,61,0.05), transparent 40%),\n      radial-gradient(circle at 80% 100%, rgba(31,27,22,0.04), transparent 40%);\n    transition: background-color 320ms ease, color 320ms ease;\n  }\n  body.dark {\n    background-image:\n      radial-gradient(circle at 20% 0%, rgba(224,122,95,0.10), transparent 45%),\n      radial-gradient(circle at 80% 100%, rgba(0,0,0,0.4), transparent 45%);\n  }\n\n  button { font-family: inherit; cursor: pointer; }\n  input, textarea { font-family: inherit; }\n\n  /* ===========================================================\n     STAGE — top-level prototype shell\n     =========================================================== */\n  .stage {\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n  }\n\n  .topbar {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 18px 28px;\n    border-bottom: 1px solid var(--border-default);\n    background: var(--topbar-blur);\n    backdrop-filter: blur(20px);\n    -webkit-backdrop-filter: blur(20px);\n    position: sticky;\n    top: 0;\n    z-index: 50;\n  }\n  .topbar-brand {\n    display: flex; align-items: baseline; gap: 14px;\n  }\n  .topbar-brand .mark {\n    font-family: var(--serif);\n    font-weight: 500;\n    font-size: 20px;\n    letter-spacing: -0.02em;\n  }\n  .topbar-brand .sub {\n    font-size: 12px;\n    color: var(--ink-muted);\n    letter-spacing: 0.02em;\n  }\n\n  .topbar-controls {\n    display: flex; gap: 8px; align-items: center;\n  }\n  .seg {\n    display: inline-flex;\n    background: var(--surface-nika);\n    border-radius: var(--radius-pill);\n    padding: 4px;\n    border: 1px solid var(--border-default);\n  }\n  .seg button {\n    border: none; background: transparent;\n    padding: 8px 16px;\n    font-size: 13px;\n    color: var(--ink-secondary);\n    border-radius: var(--radius-pill);\n    transition: all 200ms ease;\n    font-weight: 500;\n  }\n  .seg button.is-active {\n    background: var(--ink-primary);\n    color: var(--bg-primary);\n  }\n\n  .nav-pills {\n    display: flex; flex-wrap: wrap; gap: 6px;\n    padding: 14px 28px;\n    border-bottom: 1px solid var(--border-default);\n    background: var(--bg-primary);\n  }\n  .nav-pill {\n    border: 1px solid var(--border-default);\n    background: transparent;\n    padding: 7px 14px;\n    border-radius: var(--radius-pill);\n    font-size: 12px;\n    color: var(--ink-secondary);\n    transition: all 180ms ease;\n    letter-spacing: 0.01em;\n  }\n  .nav-pill:hover { border-color: var(--ink-primary); color: var(--ink-primary); }\n  .nav-pill.is-active {\n    background: var(--ink-primary);\n    color: var(--bg-primary);\n    border-color: var(--ink-primary);\n  }\n  .nav-pill .num {\n    font-family: var(--mono);\n    font-size: 10px;\n    opacity: 0.5;\n    margin-right: 6px;\n  }\n  .nav-pill.is-active .num { opacity: 0.7; }\n\n  /* ===========================================================\n     CANVAS — holds the device frames\n     =========================================================== */\n  .canvas {\n    flex: 1;\n    display: flex;\n    align-items: flex-start;\n    justify-content: center;\n    padding: 48px 24px 80px;\n  }\n\n  /* ===========================================================\n     MOBILE FRAME (iPhone)\n     =========================================================== */\n  .iphone {\n    width: 390px;\n    height: 844px;\n    background: var(--bg-primary);\n    border-radius: 54px;\n    border: 12px solid var(--frame-bezel);\n    box-shadow: var(--shadow-frame);\n    position: relative;\n    overflow: hidden;\n    flex-shrink: 0;\n  }\n  .iphone .notch {\n    position: absolute;\n    top: 12px; left: 50%;\n    transform: translateX(-50%);\n    width: 120px; height: 32px;\n    background: var(--notch);\n    border-radius: 20px;\n    z-index: 100;\n  }\n  .iphone .status {\n    position: absolute;\n    top: 0; left: 0; right: 0;\n    height: 50px;\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    padding: 18px 32px 0;\n    font-size: 15px;\n    font-weight: 600;\n    z-index: 99;\n  }\n  .iphone .status .indicators {\n    display: flex; gap: 6px; align-items: center;\n  }\n  .iphone .home-indicator {\n    position: absolute;\n    bottom: 8px; left: 50%;\n    transform: translateX(-50%);\n    width: 134px; height: 5px;\n    background: var(--ink-primary);\n    border-radius: 3px;\n    z-index: 100;\n    opacity: 0.9;\n  }\n  .iphone .screen {\n    position: absolute;\n    inset: 0;\n    overflow-y: auto;\n    overflow-x: hidden;\n    background: var(--bg-primary);\n  }\n  .iphone .screen::-webkit-scrollbar { display: none; }\n  .iphone .screen { -ms-overflow-style: none; scrollbar-width: none; }\n\n  /* ===========================================================\n     DESKTOP FRAME\n     =========================================================== */\n  .desktop {\n    width: 1200px;\n    max-width: 100%;\n    height: 800px;\n    background: var(--bg-primary);\n    border-radius: 14px;\n    border: 1px solid var(--border-strong);\n    box-shadow: var(--shadow-frame);\n    overflow: hidden;\n    display: none;\n    flex-direction: column;\n  }\n  .desktop.is-active { display: flex; }\n  .desktop-chrome {\n    height: 38px;\n    background: var(--surface-nika);\n    border-bottom: 1px solid var(--border-default);\n    display: flex; align-items: center;\n    padding: 0 16px;\n    gap: 8px;\n    flex-shrink: 0;\n  }\n  .desktop-chrome .dot {\n    width: 12px; height: 12px; border-radius: 50%;\n    background: #D4C9B5;\n  }\n  .desktop-chrome .url {\n    margin-left: 12px;\n    background: var(--bg-elevated);\n    border: 1px solid var(--border-default);\n    border-radius: 8px;\n    padding: 5px 14px;\n    font-family: var(--mono);\n    font-size: 11px;\n    color: var(--ink-muted);\n    flex: 1;\n    max-width: 360px;\n  }\n  .desktop-body { flex: 1; display: flex; min-height: 0; }\n\n  /* ===========================================================\n     SHARED — chat surface\n     =========================================================== */\n  .nika-header {\n    position: sticky;\n    top: 0;\n    z-index: 10;\n    padding: 60px 20px 14px;\n    background: var(--bg-blur);\n    backdrop-filter: blur(16px);\n    -webkit-backdrop-filter: blur(16px);\n    border-bottom: 1px solid var(--border-subtle);\n    display: flex;\n    align-items: center;\n    gap: 12px;\n  }\n  .nika-avatar {\n    width: 36px; height: 36px;\n    border-radius: 50%;\n    background: linear-gradient(135deg, #F4E4D6 0%, #E8B7A8 60%, #C8553D 130%);\n    position: relative;\n    flex-shrink: 0;\n    box-shadow: 0 0 0 3px rgba(200,85,61,0.06);\n  }\n  .nika-avatar::after {\n    content: '';\n    position: absolute;\n    bottom: 0; right: 0;\n    width: 10px; height: 10px;\n    background: #7BA968;\n    border: 2px solid var(--bg-primary);\n    border-radius: 50%;\n  }\n  .nika-name {\n    flex: 1;\n    display: flex;\n    flex-direction: column;\n    line-height: 1.1;\n  }\n  .nika-name .n {\n    font-family: var(--serif);\n    font-weight: 500;\n    font-size: 17px;\n    letter-spacing: -0.01em;\n  }\n  .nika-name .s {\n    font-size: 11px;\n    color: var(--ink-muted);\n    margin-top: 3px;\n    letter-spacing: 0.02em;\n  }\n  .nika-header .more {\n    width: 36px; height: 36px;\n    border-radius: 50%;\n    background: transparent;\n    border: none;\n    display: flex; align-items: center; justify-content: center;\n    color: var(--ink-secondary);\n  }\n  .nika-header .more:hover { background: var(--surface-nika); }\n\n  .context-strip {\n    margin: 14px 16px 0;\n    padding: 14px 16px;\n    background: var(--surface-nika);\n    border: 1px solid var(--border-subtle);\n    border-radius: 14px;\n    font-size: 13.5px;\n    color: var(--ink-secondary);\n    line-height: 1.45;\n    display: flex;\n    gap: 10px;\n    align-items: flex-start;\n  }\n  .context-strip.warm {\n    background: var(--surface-warm);\n    border-color: rgba(200,85,61,0.18);\n  }\n  .context-strip .marker {\n    width: 6px; height: 6px;\n    background: var(--accent);\n    border-radius: 50%;\n    margin-top: 7px;\n    flex-shrink: 0;\n  }\n\n  .chat-area {\n    padding: 20px 16px 12px;\n    display: flex;\n    flex-direction: column;\n    gap: 8px;\n  }\n  .timestamp {\n    text-align: center;\n    font-size: 11px;\n    color: var(--ink-muted);\n    margin: 12px 0 6px;\n    letter-spacing: 0.04em;\n    text-transform: uppercase;\n  }\n  .bubble {\n    max-width: 78%;\n    padding: 12px 16px;\n    border-radius: var(--radius-bubble);\n    line-height: 1.5;\n    font-size: 15.5px;\n    word-wrap: break-word;\n    animation: bubbleIn 320ms ease-out;\n  }\n  @keyframes bubbleIn {\n    from { opacity: 0; transform: translateY(6px); }\n    to { opacity: 1; transform: translateY(0); }\n  }\n  .bubble.nika {\n    background: var(--surface-nika);\n    color: var(--ink-primary);\n    border-bottom-left-radius: 6px;\n    align-self: flex-start;\n    font-family: var(--serif);\n    font-weight: 400;\n    font-size: 16px;\n    letter-spacing: -0.005em;\n  }\n  .bubble.user {\n    background: var(--user-bubble-bg);\n    color: var(--user-bubble-fg);\n    border-bottom-right-radius: 6px;\n    align-self: flex-end;\n    font-weight: 400;\n  }\n  .typing {\n    background: var(--surface-nika);\n    align-self: flex-start;\n    padding: 14px 18px;\n    border-radius: var(--radius-bubble);\n    border-bottom-left-radius: 6px;\n    display: flex;\n    gap: 4px;\n  }\n  .typing span {\n    width: 6px; height: 6px;\n    background: var(--ink-muted);\n    border-radius: 50%;\n    animation: breathe 1.4s ease-in-out infinite;\n  }\n  .typing span:nth-child(2) { animation-delay: 0.2s; }\n  .typing span:nth-child(3) { animation-delay: 0.4s; }\n  @keyframes breathe {\n    0%, 60%, 100% { opacity: 0.3; transform: scale(0.85); }\n    30% { opacity: 1; transform: scale(1); }\n  }\n\n  .suggestions {\n    display: flex;\n    gap: 8px;\n    overflow-x: auto;\n    padding: 12px 16px 4px;\n    scroll-behavior: smooth;\n  }\n  .suggestions::-webkit-scrollbar { display: none; }\n  .suggestion {\n    flex-shrink: 0;\n    padding: 9px 16px;\n    background: var(--bg-elevated);\n    border: 1px solid var(--border-default);\n    border-radius: var(--radius-pill);\n    font-size: 13px;\n    color: var(--ink-primary);\n    transition: all 180ms ease;\n    white-space: nowrap;\n  }\n  .suggestion:hover { border-color: var(--ink-primary); }\n  .suggestion:active { transform: scale(0.96); }\n\n  .input-bar {\n    position: sticky;\n    bottom: 0;\n    background: var(--bg-blur-strong);\n    backdrop-filter: blur(16px);\n    -webkit-backdrop-filter: blur(16px);\n    border-top: 1px solid var(--border-subtle);\n    padding: 12px 14px 32px;\n    display: flex;\n    align-items: flex-end;\n    gap: 10px;\n  }\n  .input-bar .icon-btn {\n    width: 36px; height: 36px;\n    border: none;\n    background: transparent;\n    border-radius: 50%;\n    color: var(--ink-secondary);\n    display: flex; align-items: center; justify-content: center;\n    flex-shrink: 0;\n  }\n  .input-bar .icon-btn:hover { background: var(--surface-nika); }\n  .input-wrap {\n    flex: 1;\n    background: var(--bg-elevated);\n    border: 1px solid var(--border-default);\n    border-radius: 22px;\n    padding: 8px 14px;\n    display: flex;\n    align-items: center;\n    transition: border-color 200ms;\n  }\n  .input-wrap:focus-within { border-color: var(--ink-primary); }\n  .input-wrap input {\n    flex: 1;\n    border: none;\n    background: transparent;\n    outline: none;\n    font-size: 15px;\n    color: var(--ink-primary);\n    padding: 6px 0;\n  }\n  .input-wrap input::placeholder { color: var(--ink-muted); }\n  .send-btn {\n    width: 36px; height: 36px;\n    border-radius: 50%;\n    background: var(--ink-primary);\n    border: none;\n    color: var(--bg-primary);\n    display: flex; align-items: center; justify-content: center;\n    flex-shrink: 0;\n    transition: transform 180ms ease, background 180ms;\n  }\n  .send-btn:hover { background: var(--accent); }\n  .send-btn:active { transform: scale(0.92); }\n  .send-btn.disabled { background: var(--ink-faint); }\n\n  /* ===========================================================\n     ONBOARDING\n     =========================================================== */\n  .onb {\n    position: relative;\n    height: 100%;\n    display: flex;\n    flex-direction: column;\n    background: var(--bg-primary);\n    padding-top: 60px;\n  }\n  .onb-progress {\n    display: flex;\n    gap: 4px;\n    padding: 20px 24px 0;\n  }\n  .onb-progress .seg-bar {\n    flex: 1;\n    height: 2px;\n    background: var(--border-default);\n    border-radius: 2px;\n    transition: background 300ms;\n  }\n  .onb-progress .seg-bar.active { background: var(--ink-primary); }\n\n  .onb-back {\n    position: absolute;\n    top: 60px;\n    left: 12px;\n    width: 40px; height: 40px;\n    background: transparent;\n    border: none;\n    color: var(--ink-secondary);\n    display: flex; align-items: center; justify-content: center;\n    z-index: 5;\n  }\n  .onb-content {\n    flex: 1;\n    padding: 36px 24px 32px;\n    display: flex;\n    flex-direction: column;\n    justify-content: flex-start;\n  }\n  .onb-question-bubble {\n    background: var(--surface-nika);\n    padding: 20px 22px;\n    border-radius: "x\">×<\u002Fdiv><div><div class=\"h\">Я не считаю тебя «продуктивной» или «нет»<\u002Fdiv><div class=\"b\">У меня нет KPI на твою регулярность. Пропуск — не провал. Серия — не достижение. Я <em>просто рядом<\u002Fem>.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div class=\"d-mani-row\"><div class=\"x\">×<\u002Fdiv><div><div class=\"h\">Я не подгоняю и не мотивирую<\u002Fdiv><div class=\"b\">Не пишу «ты сможешь!» и «давай покажем им!». Это не моя интонация.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div class=\"d-mani-row\"><div class=\"x\">×<\u002Fdiv><div><div class=\"h\">Я не читаю чужие диалоги<\u002Fdiv><div class=\"b\">Твои разговоры — твои. Я <em>не сравниваю<\u002Fem> тебя с другими бегунами.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div class=\"d-mani-row\"><div class=\"x\">×<\u002Fdiv><div><div class=\"h\">Я не отвечаю на всё<\u002Fdiv><div class=\"b\">Если тема выходит за бег и состояние — я просто скажу что не знаю. Лучше чем выдумать.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div class=\"d-mani-row\"><div class=\"x\">×<\u002Fdiv><div><div class=\"h\">Я не пишу когда ты этого не разрешила<\u002Fdiv><div class=\"b\">Не более 3 пушей в неделю. Никогда после 22:00. Можно <em>выключить вообще<\u002Fem>.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"d-mani-positive\">\n                <div class=\"lbl\">А что я делаю<\u002Fdiv>\n                <div class=\"txt\">Я <em>слушаю и помню<\u002Fem>. Я возвращаю твои слова в тот момент когда они тебе нужны. И я тут — особенно когда не хочется.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- PRO (desktop) -->\n          <div class=\"screen-view d-fullview\" data-view=\"pro\" style=\"display:none;\">\n            <div class=\"d-fullview-inner\">\n              <span class=\"d-pro-stamp\">PRO · НИКА помнит<\u002Fspan>\n              <h1 class=\"d-h1\">Я <em>помню<\u002Fem> что ты говорила.<br>И могу не забывать.<\u002Fh1>\n              <p class=\"d-lede\">Бесплатная НИКА забывает разговор через 7 дней. PRO — нет.<\u002Fp>\n\n              <div class=\"d-pro-features\">\n                <div class=\"d-pro-feat\"><div class=\"ic\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\"><path d=\"M3 5C3 3.9 3.9 3 5 3H13C14.1 3 15 3.9 15 5V13C15 14.1 14.1 15 13 15H5C3.9 15 3 14.1 3 13V5Z\" stroke=\"currentColor\" stroke-width=\"1.5\"><\u002Fpath><path d=\"M6 7H12M6 9H12M6 11H10\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div class=\"ft\">Долгая память<\u002Fdiv><div class=\"fd\">Я помню что ты сказала месяц назад — и могу вернуть это в нужный момент.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div class=\"d-pro-feat\"><div class=\"ic\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\"><circle cx=\"9\" cy=\"9\" r=\"6.5\" stroke=\"currentColor\" stroke-width=\"1.5\"><\u002Fcircle><path d=\"M9 5V9L11.5 11\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div class=\"ft\">Все 5 сценариев<\u002Fdiv><div class=\"fd\">Утро · после пропуска · перед стартом · после пробежки · ночные мысли. На Free доступны 2.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div class=\"d-pro-feat\"><div class=\"ic\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\"><path d=\"M3 13L7 9L9.5 11.5L15 6\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M11 6H15V10\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div class=\"ft\">Аналитика по словам<\u002Fdiv><div class=\"fd\">Что ты чаще говорила. Когда было тяжелее. Без оценок — только наблюдения.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div class=\"d-pro-feat is-soon-feat\"><div class=\"ic\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 18 18\" fill=\"none\"><path d=\"M9 3V15M3 9H15\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div><div class=\"ft\">Strava и Garmin <span class=\"soon-tag\">скоро<\u002Fspan><\u002Fdiv><div class=\"fd\">Чтобы ты не пересказывала пробежку — я уже знаю темп и расстояние.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"d-pro-quote\">«Мне важно что НИКА помнит — ту фразу что я сказала в марте, она вернула в мае, когда я снова бросила. Без памяти это просто чат. С памятью — спутник.»<span class=\"by\">— Алия, бегает 11 месяцев<\u002Fspan><\u002Fdiv>\n\n              <div class=\"d-pro-plans\">\n                <button class=\"d-pro-plan\" onclick=\"selectPlan(this)\"><div class=\"pname\">На месяц<\u002Fdiv><div class=\"pdesc\">Без обязательств · можно отменить<\u002Fdiv><div class=\"pprice\">299 ₽<small>в месяц<\u002Fsmall><\u002Fdiv><\u002Fbutton>\n                <button class=\"d-pro-plan is-selected\" onclick=\"selectPlan(this)\"><div class=\"pname\">На год <span class=\"save\">−41%<\u002Fspan><\u002Fdiv><div class=\"pdesc\">175 ₽ в месяц · списание раз в год<\u002Fdiv><div class=\"pprice\">2 100 ₽<small>2100 ₽ / год<\u002Fsmall><\u002Fdiv><\u002Fbutton>\n              <\u002Fdiv>\n\n              <button class=\"btn-primary\" style=\"max-width:380px;\">Попробовать 7 дней бесплатно<\u002Fbutton>\n              <div style=\"margin-top:14px;font-size:12.5px;color:var(--ink-muted);max-width:520px;line-height:1.5;\">Первые 7 дней — без оплаты. Напомню за день до списания. Можно отменить в любой момент.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- PUSH (desktop) -->\n          <div class=\"screen-view d-fullview\" data-view=\"push\" style=\"display:none;\">\n            <div class=\"d-fullview-inner\">\n              <div class=\"d-eyebrow\">3 пуша за 14 дней · никогда после 22:00<\u002Fdiv>\n              <h1 class=\"d-h1\">Когда я пишу <em>первой<\u002Fem><\u002Fh1>\n              <p class=\"d-lede\">Я не дёргаю каждый день. Я пишу когда видно что момент важный — и когда ты разрешила.<\u002Fp>\n\n              <div class=\"d-push-wrap\">\n                <div class=\"d-phone-mock\"><div class=\"d-phone-screen\">\n                  <div class=\"t\">9:41<\u002Fdiv>\n                  <div class=\"d\">среда, 15 мая<\u002Fdiv>\n                  <div class=\"d-push-mini\"><div class=\"head\"><div class=\"ic\"><\u002Fdiv>НИКА · сейчас<\u002Fdiv><div class=\"ti\">Сегодня среда.<\u002Fdiv><div class=\"bd\">Я просто хотела сказать <em>привет<\u002Fem>. Не нужно бежать. Если хочешь — напиши как ты.<\u002Fdiv><\u002Fdiv>\n                  <div class=\"d-push-mini\"><div class=\"head\"><div class=\"ic\"><\u002Fdiv>НИКА · 19:14<\u002Fdiv><div class=\"ti\">4 дня без пробежки.<\u002Fdiv><div class=\"bd\">Это нормально. <em>Я пишу чтобы ты знал что я тут<\u002Fem>.<\u002Fdiv><\u002Fdiv>\n                  <div class=\"d-push-mini\"><div class=\"head\"><div class=\"ic\"><\u002Fdiv>НИКА · 21:02<\u002Fdiv><div class=\"ti\">Завтра — твои первые 5 км.<\u002Fdiv><div class=\"bd\">Не отвечай если не хочешь. <em>Я буду тут весь вечер<\u002Fem>.<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv><\u002Fdiv>\n\n                <div class=\"d-push-rules\">\n                  <div class=\"d-section-head\" style=\"margin:0 0 4px;\">Правила<\u002Fdiv>\n                  <div class=\"d-push-rule\"><div class=\"n\">1<\u002Fdiv><div><div class=\"h\">Не больше 3 в неделю<\u002Fdiv><div class=\"b\">Если я начну писать чаще — ты быстро привыкнешь меня игнорировать. Это не нужно ни мне, ни тебе.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                  <div class=\"d-push-rule\"><div class=\"n\">2<\u002Fdiv><div><div class=\"h\">Никогда после 22:00<\u002Fdiv><div class=\"b\">Ночью я молчу. Если ты сама пишешь — я отвечу. Но первой не приду.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                  <div class=\"d-push-rule\"><div class=\"n\">3<\u002Fdiv><div><div class=\"h\">Никогда «ты пропустил тренировку»<\u002Fdiv><div class=\"b\">Я не считаю пропуски как провалы. Если 4 дня без пробежки — я скажу что я тут, не что ты «срываешь план».<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                  <div class=\"d-push-rule\"><div class=\"n\">4<\u002Fdiv><div><div class=\"h\">Можно выключить полностью<\u002Fdiv><div class=\"b\">В Настройках. Тогда мы общаемся только когда ты сама открываешь приложение. Это нормальный режим — я не обижусь.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- ONBOARDING (desktop — full flow) -->\n          <div class=\"screen-view d-onboarding\" data-view=\"onboarding\" style=\"display:none;\">\n            <div class=\"d-onb-stage\" id=\"dOnbContainer\">\n\n              <!-- Step 0: Welcome -->\n              <div class=\"d-onb-step onb-step is-active\" data-step=\"0\">\n                <div class=\"d-onb-left\">\n                  <div class=\"d-onb-brand\">\n                    <span class=\"nika-mark\"><svg width=\"32\" height=\"32\" viewBox=\"0 0 26 26\" fill=\"none\"><circle cx=\"13\" cy=\"13\" r=\"12.25\" stroke=\"currentColor\" stroke-width=\"1.5\"><\u002Fcircle><path d=\"M8.5 17.5V8.5L17.5 17.5V8.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                    <span class=\"brand-name\">НИКА<\u002Fspan>\n                  <\u002Fdiv>\n                  <h1 class=\"d-onb-lead\">Я не тренер. Не план.<br>Я рядом — <em>чтобы ты не бросил<\u002Fem>.<\u002Fh1>\n                  <p class=\"d-onb-meta\">Ментальный спутник для бегунов-любителей. Текстовый диалог. Никаких таблиц, графиков, наставлений.<\u002Fp>\n                  <div class=\"d-onb-actions\">\n                    <button class=\"btn-primary\" style=\"max-width:280px;\" onclick=\"onbNext()\">Познакомимся<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div class=\"d-onb-fineprint\">~2 минуты. Можно прервать в любой момент.<\u002Fdiv>\n                <\u002Fdiv>\n                <div class=\"d-onb-right\">\n                  <div class=\"d-onb-orb\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- Step 1: Name -->\n              <div class=\"d-onb-step onb-step\" data-step=\"1\" style=\"display:none;\">\n                <div class=\"d-onb-card\">\n                  <div class=\"d-onb-progress\"><span>1<\u002Fspan> / 5<\u002Fdiv>\n                  <div class=\"d-onb-question\">Как тебя зовут?<\u002Fdiv>\n                  <p class=\"d-onb-hint\">Так я буду к тебе обращаться. Можно вымышленным.<\u002Fp>\n                  <input class=\"d-onb-input\" id=\"dOnbName\" type=\"text\" placeholder=\"Имя\" autocomplete=\"off\">\n                  <div class=\"d-onb-footer\">\n                    <button class=\"d-onb-back\" onclick=\"onbBack()\">Назад<\u002Fbutton>\n                    <button class=\"btn-primary\" id=\"dOnbNameBtn\" disabled=\"\" onclick=\"onbNext()\">Дальше<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- Step 2: Stage -->\n              <div class=\"d-onb-step onb-step\" data-step=\"2\" style=\"display:none;\">\n                <div class=\"d-onb-card\">\n                  <div class=\"d-onb-progress\"><span>2<\u002Fspan> / 5<\u002Fdiv>\n                  <div class=\"d-onb-question\">На каком ты этапе?<\u002Fdiv>\n                  <p class=\"d-onb-hint\">Выбери один вариант.<\u002Fp>\n                  <div class=\"d-onb-options\">\n                    <button class=\"d-onb-option\" data-q=\"dstage\" onclick=\"dSelectCard(this, true)\">\n                      <div class=\"t\">Только начинаю<\u002Fdiv>\n                      <div class=\"d\">0–5 км. Всё впереди.<\u002Fdiv>\n                    <\u002Fbutton>\n                    <button class=\"d-onb-option\" data-q=\"dstage\" onclick=\"dSelectCard(this, true)\">\n                      <div class=\"t\">Возвращаюсь после перерыва<\u002Fdiv>\n                      <div class=\"d\">Уже бегал, сейчас сложно начать снова.<\u002Fdiv>\n                    <\u002Fbutton>\n                    <button class=\"d-onb-option\" data-q=\"dstage\" onclick=\"dSelectCard(this, true)\">\n                      <div class=\"t\">Бегаю но нерегулярно<\u002Fdiv>\n                      <div class=\"d\">Хочу стабильности и не бросать.<\u002Fdiv>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                  <div class=\"d-onb-footer\">\n                    <button class=\"d-onb-back\" onclick=\"onbBack()\">Назад<\u002Fbutton>\n                    <button class=\"btn-primary\" onclick=\"onbNext()\">Дальше<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- Step 3: Barriers -->\n              <div class=\"d-onb-step onb-step\" data-step=\"3\" style=\"display:none;\">\n                <div class=\"d-onb-card\">\n                  <div class=\"d-onb-progress\"><span>3<\u002Fspan> / 5<\u002Fdiv>\n                  <div class=\"d-onb-question\">Что мешает чаще всего?<\u002Fdiv>\n                  <p class=\"d-onb-hint\">Можно выбрать несколько.<\u002Fp>\n                  <div class=\"d-onb-chips\">\n                    <button class=\"d-onb-chip\" onclick=\"dToggleChip(this)\">Лень<\u002Fbutton>\n                    <button class=\"d-onb-chip\" onclick=\"dToggleChip(this)\">Стыд после пропуска<\u002Fbutton>\n                    <button class=\"d-onb-chip\" onclick=\"dToggleChip(this)\">Тревога перед стартом<\u002Fbutton>\n                    <button class=\"d-onb-chip\" onclick=\"dToggleChip(this)\">Не хватает времени<\u002Fbutton>\n                    <button class=\"d-onb-chip\" onclick=\"dToggleChip(this)\">Страх травмы<\u002Fbutton>\n                    <button class=\"d-onb-chip\" onclick=\"dToggleChip(this)\">Не знаю правильно ли делаю<\u002Fbutton>\n                    <button class=\"d-onb-chip\" onclick=\"dToggleChip(this)\">Одиночество в этом<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div class=\"d-onb-footer\">\n                    <button class=\"d-onb-back\" onclick=\"onbBack()\">Назад<\u002Fbutton>\n                    <button class=\"btn-primary\" onclick=\"onbNext()\">Дальше<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- Step 4: When hardest -->\n              <div class=\"d-onb-step onb-step\" data-step=\"4\" style=\"display:none;\">\n                <div class=\"d-onb-card\">\n                  <div class=\"d-onb-progress\"><span>4<\u002Fspan> / 5<\u002Fdiv>\n                  <div class=\"d-onb-question\">Когда обычно тяжелее всего?<\u002Fdiv>\n                  <p class=\"d-onb-hint\">Можно выбрать несколько.<\u002Fp>\n                  <div class=\"d-onb-options\">\n                    <button class=\"d-onb-option\" data-q=\"dwhen\" onclick=\"dSelectCard(this, false)\">\n                      <div class=\"t\">Утром перед тренировкой<\u002Fdiv>\n                      <div class=\"d\">Не хочется выходить из дома.<\u002Fdiv>\n                    <\u002Fbutton>\n                    <button class=\"d-onb-option\" data-q=\"dwhen\" onclick=\"dSelectCard(this, false)\">\n                      <div class=\"t\">После пропуска<\u002Fdiv>\n                      <div class=\"d\">Стыдно возвращаться.<\u002Fdiv>\n                    <\u002Fbutton>\n                    <button class=\"d-onb-option\" data-q=\"dwhen\" onclick=\"dSelectCard(this, false)\">\n                      <div class=\"t\">Перед забегом или стартом<\u002Fdiv>\n                      <div class=\"d\">Тревога что не справлюсь.<\u002Fdiv>\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                  <div class=\"d iv>\n      <\u002Fdiv>\n\n        <!-- ============================================================\n             SHEETS / MODALS\n             ============================================================ -->\n        <div class=\"sheet-overlay\" data-overlay=\"\" onclick=\"if(event.target===this)closeSheet(this)\">\n\n          <!-- TONE -->\n          <div class=\"sheet\" data-sheet=\"tone\">\n            <div class=\"sheet-grab\"><\u002Fdiv>\n            <div class=\"sheet-header\">\n              <div class=\"sheet-title\">Тон общения<\u002Fdiv>\n              <button class=\"sheet-close\" onclick=\"closeSheet(this)\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 3L9 9M9 3L3 9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <p class=\"sheet-sub\">Как я буду с тобой говорить. Можно поменять в любой момент — даже посреди разговора.<\u002Fp>\n            <div class=\"sheet-radio\" data-radio-group=\"tone\">\n              <button class=\"sr-row is-selected\" onclick=\"pickRadio(this)\">\n                <div class=\"sr-info\"><div class=\"t\">Тёплый<\u002Fdiv><div class=\"d\">Мягкая, обращаюсь по имени. Признаю чувства первой.<\u002Fdiv><\u002Fdiv>\n                <div class=\"sr-check\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 6L5.5 8.5L9.5 3.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <\u002Fbutton>\n              <button class=\"sr-row\" onclick=\"pickRadio(this)\">\n                <div class=\"sr-info\"><div class=\"t\">Прямой<\u002Fdiv><div class=\"d\">Короче, без вступлений. Сразу к делу.<\u002Fdiv><\u002Fdiv>\n                <div class=\"sr-check\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 6L5.5 8.5L9.5 3.5\" stroke=\"currentColor\" stroke-w class=\"sheet-grab\"><\u002Fdiv>\n            <div class=\"sheet-header\">\n              <div class=\"sheet-title\">Когда мне писать первой<\u002Fdiv>\n              <button class=\"sheet-close\" onclick=\"closeSheet(this)\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 3L9 9M9 3L3 9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <p class=\"sheet-sub warm\"><strong>Никогда после 22:00.<\u002Fstrong> Не больше 3 раз в неделю. Можно вообще выключить.<\u002Fp>\n            <div class=\"sheet-radio\" data-radio-group=\"when\">\n              <button class=\"sr-row is-selected\" onclick=\"pickRadio(this)\">\n                <div class=\"sr-info\"><div class=\"t\">Утром<\u002Fdiv><div class=\"d\">7:00–10:00 · по умолчанию. Перед тренировкой.<\u002Fdiv><\u002Fdiv>\n                <div class=\"sr-check\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 6L5.5 8.5L9.5 3.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <\u002Fbutton>\n              <button class=\"sr-row\" onclick=\"pickRadio(this)\">\n                <div class=\"sr-info\"><div class=\"t\">Вечером<\u002Fdiv><div class=\"d\">18:00–21:30 · накануне тренировки.<\u002Fdiv><\u002Fdiv>\n                <div class=\"sr-check\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 6L5.5 8.5L9.5 3.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <\u002Fbutton>\n              <button class=\"sr-row\" onclick=\"pickRadio(this)\">\n                <div class=\"sr-info\"><div class=\"t\">Утром и вечером<\u002Fdiv><div class=\"d\">Не больше 3 раз в неделю в сумме.<\u002Fdiv><\u002Fdiv>\n                <div class=\"sr-check\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 6L5.5 8.5L9.5 3.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <\u002Fbutton>\n              <button class=\"sr-row\" onclick=\"pickRadio(this)\">\n                <div class=\"sr-info\"><div class=\"t\">Не пиши первой<\u002Fdiv><div class=\"d\">Я сама напишу когда захочу. Тишина — это ок.<\u002Fdiv><\u002Fdiv>\n                <div class=\"sr-check\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 6L5.5 8.5L9.5 3.5\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fdiv>\n            <button class=\"btn-primary\" onclick=\"saveWhen(this)\">Сохранить<\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- NAME -->\n          <div class=\"sheet\" data-sheet=\"name\">\n            <div class=\"sheet-grab\"><\u002Fdiv>\n            <div class=\"sheet-header\">\n              <div class=\"sheet-title\">Как ко мне обращаться<\u002Fdiv>\n              <button class=\"sheet-close\" onclick=\"closeSheet(this)\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 3L9 9M9 3L3 9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <p class=\"sheet-sub\">Так я буду к тебе обращаться. Можно поменять когда угодно. Можно вымышленным.<\u002Fp>\n            <input class=\"sheet-input\" type=\"text\" value=\"Аня\" data-name-input=\"\">\n            <button class=\"btn-primary\" onclick=\"saveName(this)\">Сохранить<\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- DELETE -->\n          <div class=\"sheet\" data-sheet=\"delete\">\n            <div class=\"sheet-grab\"><\u002Fdiv>\n            <div class=\"sheet-header\">\n              <div class=\"sheet-title\">Удалить все диалоги<\u002Fdiv>\n              <button class=\"sheet-close\" onclick=\"closeSheet(this)\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 3L9 9M9 3L3 9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"sheet-body\" style=\"margin:8px 0 22px;\">\n              <p>Удалю <strong>все наши разговоры<\u002Fstrong> — и все наблюдения которые я о тебе собрала. Это нельзя отменить.<\u002Fp>\n              <p>Я начну с чистого листа. Всё что ты говорила — я забуду. <em>В том числе хорошее.<\u002Fem><\u002Fp>\n              <p>У тебя есть <strong>47 дней<\u002Fstrong> с НИКОЙ. Уверена?<\u002Fp>\n            <\u002Fdiv>\n            <button class=\"btn-danger\" onclick=\"confirmDelete(this)\">Да, удалить всё<\u002Fbutton>\n            <button class=\"btn-ghost\" onclick=\"closeSheet(this)\">Не удалять<\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- EXPORT -->\n          <div class=\"sheet\" data-sheet=\"export\">\n            <div class=\"sheet-grab\"><\u002Fdiv>\n            <div class=\"sheet-header\">\n              <div class=\"sheet-title\">Экспорт диалогов<\u002Fdiv>\n              <button class=\"sheet-close\" onclick=\"closeSheet(this)\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 3L9 9M9 3L3 9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"sheet-body\" style=\"margin:8px 0 22px;\">\n              <p>Скачаю все наши разговоры одним текстовым файлом. <em>Это твои слова<\u002Fem> — ты можешь забрать их.<\u002Fp>\n              <p>Файл будет на твоём устройстве. Я не передаю его никуда.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;\">\n              <div>\n                <div style=\"font-family:var(--serif);font-size:15px;font-weight:500;\">nika-диалоги.txt<\u002Fdiv>\n                <div style=\"font-size:12px;color:var(--ink-muted);margin-top:3px;font-family:var(--mono);\">~24 КБ · 47 дней · 312 сообщений<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"color:var(--ink-muted);\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 20 20\" fill=\"none\"><path d=\"M5 15H15M10 4V13M10 13L6 9M10 13L14 9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button class=\"btn-primary\" onclick=\"closeSheet(this)\">Скачать .txt<\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- HOW -->\n          <div class=\"sheet\" data-sheet=\"how\">\n            <div class=\"sheet-grab\"><\u002Fdiv>\n            <div class=\"sheet-header\">\n              <div class=\"sheet-title\">Как НИКА работает<\u002Fdiv>\n              <button class=\"sheet-close\" onclick=\"closeSheet(this)\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 3L9 9M9 3L3 9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"sheet-body\" style=\"margin-bottom:20px;\">\n              <p><strong>Я — языковая модель<\u002Fstrong>, дообученная на разговорной интонации поддерживающего диалога. Не врач, не тренер. <em>Собеседник.<\u002Fem><\u002Fp>\n              <p>Когда ты пишешь — я читаю наш контекст (твои предыдущие слова) и отвечаю в твоём тоне. Я помню что ты говорила раньше — и могу вернуть это в нужный момент.<\u002Fp>\n              <p><strong>Что я <em>не<\u002Fem> делаю:<\u002Fstrong> не оцениваю, не диагностирую, не сравниваю с другими. Подробнее — в разделе «Что НИКА не делает».<\u002Fp>\n              <p><strong>Приватность.<\u002Fstrong> Твои разговоры зашифрованы. Я <em>не<\u002Fem> передаю их третьим лицам, не использую для рекламы, не учусь на них без твоего согласия.<\u002Fp>\n            <\u002Fdiv>\n            <button class=\"btn-secondary\" onclick=\"goToManifestoFromSheet(this)\">Что НИКА не делает →<\u002Fbutton>\n          <\u002Fdiv>\n\n          <!-- SUPPORT -->\n          <div class=\"sheet\" data-sheet=\"support\">\n            <div class=\"sheet-grab\"><\u002Fdiv>\n            <div class=\"sheet-header\">\n              <div class=\"sheet-title\">Поддержка<\u002Fdiv>\n              <button class=\"sheet-close\" onclick=\"closeSheet(this)\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 3L9 9M9 3L3 9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <p class=\"sheet-sub\">Если что-то не работает или есть мысли — напиши живому человеку из команды.<\u002Fp>\n            <a class=\"sheet-link\" href=\"mailto:team@nika.app\">\n              <div>\n                <div style=\"font-family:var(--serif);font-size:15px;\">team@nika.app<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--ink-muted);margin-top:2px;\">отвечаем за день, обычно быстрее<\u002Fdiv>\n              <\u002Fdiv>\n              <span class=\"arr\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 7H11M11 7L7 3M11 7L7 11\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <\u002Fa>\n            <a class=\"sheet-link\" href=\"https://t.me/nika_run_bot\">\n              <div>\n                <div style=\"font-family:var(--serif);font-size:15px;\">Telegram<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:var(--ink-muted);margin-top:2px;\">@nika_run_bot · короткие вопросы<\u002Fdiv>\n              <\u002Fdiv>\n              <span class=\"arr\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 7H11M11 7L7 3M11 7L7 11\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <\u002Fa>\n            <div class=\"sheet-fine\">v 1.0.0 · build 247<\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- TERMS -->\n          <div class=\"sheet\" data-sheet=\"terms\">\n            <div class=\"sheet-grab\"><\u002Fdiv>\n            <div class=\"sheet-header\">\n              <div class=\"sheet-title\">Условия и приватность<\u002Fdiv>\n              <button class=\"sheet-close\" onclick=\"closeSheet(this)\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M3 3L9 9M9 3L3 9\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n            <div class=\"sheet-body\" style=\"margin-bottom:18px;\">\n              <p><strong>Если коротко:<\u002Fstrong> мы храним только то что ты пишешь. Не передаём третьим лицам. Не учимся на твоих разговорах без согласия. Можно удалить всё в один клик.<\u002Fp>\n            <\u002Fdiv>\n            <a class=\"sheet-link\" href=\"#\">\n              <div>Условия использования<\u002Fdiv>\n              <span class=\"arr\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 7H11M11 7L7 3M11 7L7 11\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <\u002Fa>\n            <a class=\"sheet-link\" href=\"#\">\n              <div>Политика приватности<\u002Fdiv>\n              <span class=\"arr\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 7H11M11 7L7 3M11 7L7 11\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <\u002Fa>\n            <a class=\"sheet-link\" href=\"#\">\n              <div>Как мы обучаем модель<\u002Fdiv>\n              <span class=\"arr\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\"><path d=\"M3 7H11M11 7L7 3M11 7L7 11\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <\u002Fa>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"footer-credit\">\n    NIKA prototype <span class=\"dot\">●<\u002Fspan> переключайся между экранами в навигации сверху <span class=\"dot\">●<\u002Fspan> mobile + desktop\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"helper-note\" id=\"helperNote\"><\u002Fdiv>\n\n<script>\n  // ===========================================================\n  // Platform switching\n  // ===========================================================\n  const platformSeg = document.getElementById('platformSeg');\n  const mobileFrame = document.getElementById('mobileFrame');\n  const desktopFrame = document.getElementById('desktopFrame');\n\n  platformSeg.addEventListener('click', (e) => {\n    const btn = e.target.closest('button');\n    if (!btn) return;\n    platformSeg.querySelectorAll('button').forEach(b => b.classList.remove('is-active'));\n    btn.classList.add('is-active');\n    const platform = btn.dataset.platform;\n    if (platform === 'mobile') {\n      mobileFrame.style.display = 'block';\n      desktopFrame.classList.remove('is-active');\n    } else {\n      mobileFrame.style.display = 'none';\n      desktopFrame.classList.add('is-active');\n    }\n  });\n\n  // ===========================================================\n  // Screen routing (mobile + desktop)\n  // ===========================================================\n  const navPills = document.getElementById('navPills');\n\n  function goScreen(name) {\n    // mobile\n    document.querySelectorAll('.iphone .screen-view').forEach(v => {\n      v.classList.toggle('is-active', v.dataset.view === name);\n    });\n    // desktop — match each view to its preferred display mode\n    document.querySelectorAll('.desktop .screen-view').forEach(v => {\n      const active = v.dataset.view === name;\n      v.classList.toggle('is-active', active);\n      if (!active) {\n        v.style.display = 'none';\n      } else {\n        if (v.classList.contains('d-fullview')) v.style.display = 'block';\n        else if (v.classList.contains('d-tracking-simple')) v.style.display = 'block';\n        else if (v.classList.contains('d-tracking')) v.style.display = 'grid';\n        else if (v.classList.contains('d-onboarding')) v.style.display = 'flex';\n        else v.style.display = 'flex';\n      }\n    });\n    // nav pills\n    document.querySelectorAll('.nav-pill').forEach(p => p.classList.toggle('is-active', p.dataset.screen === name));\n    // desktop sidebar navlinks\n    document.querySelectorAll('.d-navlink').forEach(p => p.classList.toggle('is-active', p.dataset.screen === name));\n    // scroll mobile to top\n    document.getElementById('mobileScreen').scrollTop = 0;\n    // hide rail on non-chat desktop views\n    const rail = document.getElementById('dRail');\n    const railViews = ['today', 'today-skip', 'today-prerace', 'conversation'];\n    if (rail) rail.style.display = railViews.includes(name) ? 'block' : 'none';\n    // scroll desktop fullview to top\n    document.querySelectorAll('.desktop .d-fullview').forEach(v => v.scrollTop = 0);\n    // animate\n    const active = document.querySelector(`.iphone .screen-view[data-view=\"${name}\"]`);\n    if (active) active.classList.add('fade-in');\n    setTimeout(() => active?.classList.remove('fade-in'), 400);\n  }\n\n  function setDesktopView(name) {\n    goScreen(name);\n  }\n\n  navPills.addEventListener('click', (e) => {\n    const btn = e.target.closest('.nav-pill');\n    if (!btn) return;\n    if (btn.dataset.sheetPill) {\n      // First go to profile, then open the sheet in the active platform\n      const isDesktop = document.querySelector('[data-platform=desktop]').classList.contains('is-active');\n      goScreen('profile');\n      // Find the right root frame\n      setTimeout(() => {\n        const root = isDesktop ? document.querySelector('.desktop') : document.querySelector('.iphone');\n        const anchor = root && root.querySelector('.sheet-overlay');\n        if (anchor) openSheet(btn.dataset.sheetPill, anchor);\n        // also toggle active pill state\n        document.querySelectorAll('.nav-pill').forEach(p => p.classList.remove('is-active'));\n        btn.classList.add('is-active');\n      }, 80);\n      return;\n    }\n    goScreen(btn.dataset.screen);\n  });\n\n  // ===========================================================\n  // Onboarding logic\n  // ===========================================================\n  let onbStep = 0;\n  const onbContainer = document.getElementById('onbContainer');\n\n  function showOnbStep(n) {\n    // Update both mobile and desktop onboarding containers in lockstep\n    document.querySelectorAll('.onb-step').forEach(s => {\n      const isStep = parseInt(s.dataset.step) === n;\n      s.style.display = isStep ? 'flex' : 'none';\n      if (isStep) {\n        s.classList.add('fade-in');\n        setTimeout(() => s.classList.remove('fade-in'), 400);\n      }\n    });\n    onbStep = n;\n  }\n  // Desktop onboarding helpers\n  function dSelectCard(el, single) {\n    if (single) el.parentElement.querySelectorAll('.d-onb-option[data-q=\"' + el.dataset.q + '\"]').forEach(c => c.classList.remove('is-selected'));\n    el.classList.toggle('is-selected');\n  }\n  function dToggleChip(el) { el.classList.toggle('is-selected'); }\n  // Desktop name input gating + sync to mobile\n  document.getElementById('dOnbName')?.addEventListener('input', (e) => {\n    const ok = e.target.value.trim().length >= 2;\n    const btn = document.getElementById('dOnbNameBtn');\n    if (btn) btn.disabled = !ok;\n    const mob = document.getElementById('onbName');\n    if (mob) { mob.value = e.target.value; mob.dispatchEvent(new Event('input')); }\n  });\n\n  function onbNext() {\n    if (onbStep >= 6) {\n      goScreen('day1');\n      return;\n    }\n    showOnbStep(onbStep + 1);\n  }\n  function onbBack() {\n    if (onbStep > 0) showOnbStep(onbStep - 1);\n  }\n\n  // Name input gating\n  const nameInput = document.getElementById('onbName');\n  const nameBtn = document.getElementById('onbNameBtn');\n  nameInput?.addEventListener('input', () => {\n    nameBtn.disabled = nameInput.value.trim().length < 2;\n  });\n\n  // Card selection\n  function selectCard(el, single) {\n    if (single) {\n      el.parentElement.querySelectorAll(`.onb-card[data-q=\"${el.dataset.q}\"]`).forEach(c => c.classList.remove('is-selected'));\n    }\n    el.classList.toggle('is-selected');\n  }\n  function toggleChip(el) {\n    el.classList.toggle('is-selected');\n  }\n\n  // ===========================================================\n  // Chat send (local, fake reply)\n  // ===========================================================\n  function showHelper(text) {\n    const h = document.getElementById('helperNote');\n    h.textContent = text;\n    h.classList.add('show');\n    setTimeout(() => h.classList.remove('show'), 1800);\n  }\n\n  function sendInput(view) {\n    const input = document.getElementById('todayInput');\n    if (!input) return;\n    const text = input.value.trim();\n    if (!text) return;\n    appendMessage(text, 'user', view);\n    input.value = '';\n    // fake nika reply\n    setTimeout(() => {\n      const replies = [\n        'Я слышу. Что больше всего сейчас давит?',\n        'Хорошо что написал. Расскажи подробнее.',\n        'Это понятно. Не торопись с ответом — я тут.',\n        'Назови это вслух — иногда уже от этого легче.'\n      ];\n      appendMessage(replies[Math.floor(Math.random()*replies.length)], 'nika', view);\n    }, 700);\n  }\n\n  function sendSuggestion(btn, view) {\n    const text = btn.textContent;\n    appendMessage(text, 'user', view);\n    setTimeout(() => appendMessage('Я слышу. Расскажи подробнее — что именно сейчас сложнее всего.', 'nika', view), 700);\n  }\n\n  function appendMessage(text, who, view) {\n    const chat = document.querySelector(`.iphone .screen-view[data-view=\"${view}\"] .chat-area`);\n    if (!chat) return;\n    const b = document.createElement('div');\n    b.className = `bubble ${who}`;\n    b.textContent = text;\n    chat.appendChild(b);\n    document.getElementById('mobileScreen').scrollTop = document.getElementById('mobileScreen').scrollHeight;\n  }\n\n  // ===========================================================\n  // Theme toggle (light / dark)\n  // ===========================================================\n  const themeToggle = document.getElementById('themeToggle');\n  function applyTheme(name) {\n    document.body.classList.toggle('dark', name === 'dark');\n    try { localStorage.setItem('nika_theme', name); } catch (_) {}\n    // Sync any in-app dark switches\n    document.querySelectorAll('[data-toggle=\"theme\"]').forEach(t => t.classList.toggle('on', name === 'dark'));\n  }\n  themeToggle?.addEventListener('click', () => {\n    applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');\n  });\n  document.getElementById('dThemeToggle')?.addEventListener('click', () => {\n    applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');\n  });\n  // keep state label in sync\n  const _origApplyTheme = applyTheme;\n  applyTheme = function(name) {\n    _origApplyTheme(name);\n    const lbl = document.querySelector('#dThemeToggle .d-theme-state');\n    if (lbl) lbl.textContent = (name === 'dark') ? 'On' : 'Off';\n  };\n  try {\n    const saved = localStorage.getItem('nika_theme');\n    if (saved === 'dark') applyTheme('dark');\n  } catch (_) {}\n\n  // PRO plan selector\n  function selectPlan(el) {\n    el.parentElement.querySelectorAll('.pro-plan').forEach(p => p.classList.remove('is-selected'));\n    el.classList.add('is-selected');\n  }\n\n\n\n  // ============================================================\n  // SHEETS / MODALS\n  // ============================================================\n  function openSheet(name, sourceEl) {\n    const root = (sourceEl && sourceEl.closest('.iphone, .desktop')) || document.querySelector('.iphone');\n    if (!root) return;\n    const overlay = root.querySelector('.sheet-overlay');\n    if (!overlay) return;\n    overlay.querySelectorAll('.sheet').forEach(sh => sh.classList.toggle('is-active', sh.dataset.sheet === name));\n    overlay.classList.add('is-open');\n  }\n  function openSheetFromAny(srcEl, name) {\n    // Used when one sheet wants to open another. First close, then open.\n    closeSheet(srcEl);\n    // brief delay to let animation finish\n    setTimeout(() => {\n      const root = srcEl.closest('.iphone, .desktop');\n      if (name === 'pro') {\n        if (root && root.classList.contains('desktop')) setDesktopView('pro');\n        else goScreen('pro');\n      } else {\n        openSheet(name, srcEl);\n      }\n    }, 280);\n  }\n  function closeSheet(sourceEl) {\n    const root = (sourceEl && sourceEl.closest('.iphone, .desktop')) || document.querySelector('.iphone');\n    if (!root) return;\n    const overlay = root.querySelector('.sheet-overlay');\n    if (!overlay) return;\n    overlay.classList.remove('is-open');\n  }\n  function pickRadio(el) {\n    const group = el.closest('[data-radio-group]');\n    if (!group) return;\n    group.querySelectorAll('.sr-row').forEach(r => r.classList.remove('is-selected'));\n    el.classList.add('is-selected');\n  }\n  function saveTone(el) {\n    const sheet = el.closest('.sheet');\n    const sel = sheet.querySelector('.sr-row.is-selected .sr-info .t');\n    if (sel) {\n      // update profile row value in same frame\n      const root = el.closest('.iphone, .desktop');\n      const row = root.querySelector('[data-row=\"tone\"] .v');\n      if (row) row.textContent = sel.textContent;\n    }\n    closeSheet(el);\n  }\n  function saveWhen(el) {\n    const sheet = el.closest('.sheet');\n    const sel = sheet.querySelector('.sr-row.is-selected .sr-info .t');\n    if (sel) {\n      const root = el.closest('.iphone, .desktop');\n      const row = root.querySelector('[data-row=\"when\"] .v');\n      if (row) row.textContent = sel.textContent;\n    }\n    closeSheet(el);\n  }\n  function saveName(el) {\n    const sheet = el.closest('.sheet');\n    const inp = sheet.querySelector('[data-name-input]');\n    const newName = (inp && inp.value.trim()) || 'Аня';\n    const root = el.closest('.iphone, .desktop');\n    const row = root.querySelector('[data-row=\"name\"] .v');\n    if (row) row.textContent = newName;\n    closeSheet(el);\n  }\n  function confirmDelete(el) {\n    showHelper && showHelper('Удалено. Я начну сначала.');\n    closeSheet(el);\n  }\n  function goToManifestoFromSheet(srcEl) {\n    closeSheet(srcEl);\n    setTimeout(() => {\n      const root = srcEl.closest('.iphone, .desktop');\n      if (root && root.classList.contains('desktop')) setDesktopView('manifesto');\n      else goScreen('manifesto');\n    }, 260);\n  }\n\n  // Initialize\n  goScreen('onboarding');\n  showOnbStep(0);\n  // Default view for desktop (when switched)\n  document.querySelector('.desktop .screen-view[data-view=\"today\"]').classList.add('is-active');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
